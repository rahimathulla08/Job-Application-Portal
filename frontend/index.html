
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Job Application Portal</title>

    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">

        <header>
            <h1>Job Application Portal</h1>
            <p>Register your profile and explore career opportunities.</p>
        </header>

        <form id="applicationForm">

            <h2>Personal Information</h2>

            <div class="form-row">

                <div class="form-group">
                    <label>First Name *</label>
                    <input type="text" id="firstName"
                           placeholder="Enter first name" required>
                </div>

                <div class="form-group">
                    <label>Last Name *</label>
                    <input type="text" id="lastName"
                           placeholder="Enter last name" required>
                </div>

            </div>

            <div class="form-row">

                <div class="form-group">
                    <label>Email Address *</label>
                    <input type="email" id="email"
                           placeholder="Enter email" required>
                </div>

                <div class="form-group">
                    <label>Phone Number *</label>
                    <input type="tel" id="phone"
                           placeholder="Enter phone number"
                           pattern="[0-9]{10}" maxlength="10" required>
                </div>

            </div>

            <div class="form-group">
                <label>Address *</label>
                <textarea id="address"
                          placeholder="Enter your complete address"
                          rows="3" required></textarea>
            </div>

            <hr>

            <h2>Professional Information</h2>

            <div class="form-group">
                <label>Skills You Know *</label>
                <textarea id="skills"
                          placeholder="Example: Java, Python, SQL, Spring Boot, HTML, CSS"
                          rows="3" required></textarea>
                <small>Separate skills using commas.</small>
            </div>

            <div class="form-group">
                <label>Job Roles You Are Looking For *</label>

                <div class="checkbox-group">
                    <label><input type="checkbox" name="roles" value="Java Developer"> Java Developer</label>

                    <label><input type="checkbox" name="roles" value="Python Developer"> Python Developer</label>

                    <label><input type="checkbox" name="roles" value="Software Developer"> Software Developer</label>

                    <label><input type="checkbox" name="roles" value="Frontend Developer"> Frontend Developer</label>

                    <label><input type="checkbox" name="roles" value="Backend Developer"> Backend Developer</label>

                    <label><input type="checkbox" name="roles" value="AI/ML Engineer"> AI/ML Engineer</label>

                    <label><input type="checkbox" name="roles" value="Data Analyst"> Data Analyst</label>
                </div>
            </div>

            <div class="form-row">

                <div class="form-group">
                    <label>Experience Level *</label>

                    <select id="experienceLevel" required>
                        <option value="">Select experience</option>
                        <option value="Fresher">Fresher</option>
                        <option value="Intern">Intern</option>
                        <option value="Experienced">Experienced</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>Years of Experience *</label>

                    <input type="number" id="experience"
                           min="0" max="50" step="0.5"
                           placeholder="Example: 0" required>
                </div>

            </div>

            <hr>

            <h2>Upload Resume</h2>

            <div class="form-group">
                <label>Upload Your Resume (PDF/DOC/DOCX) *</label>

                <input type="file" id="resume"
                       accept=".pdf,.doc,.docx" required>

                <small>Maximum file size: 5 MB.</small>
            </div>

            <button type="submit" id="submitBtn">
                Submit Application
            </button>

            <p id="message"></p>

        </form>

    </div>

    <script src="script.js"></script>

</body>
</html>
